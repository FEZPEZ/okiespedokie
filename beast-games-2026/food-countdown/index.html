<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Countdown</title>

<!-- PWA / fullscreen -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="manifest" href="manifest.json">

<!-- Silkscreen font -->
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400&display=swap" rel="stylesheet">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        overflow: hidden;
        height: 100%;
    }
    
    #crt {
    width: 100vw;
    height: 100vh;
    perspective: 900px;
    overflow: hidden;
    background: black;
}

    #screen {
    width: 100vw;
    height: 100vh;

    display: grid;
    place-items: center;

    font-family: "Handjet", monospace;
    font-weight: 400;
    font-size: min(85vw, 85dvh);

    line-height: 1;

    color: #00ffaa;
    user-select: none;
    transition: transform 1ms linear;
    
    transform: rotateX(5.5deg) scale(1.02);
    transform-origin: center;
    
    text-shadow:
        0 0 0.5vh rgba(0, 255, 170, 0.9),
        0 0 1.2vh rgba(0, 255, 170, 0.6),
        0 0 2.5vh rgba(0, 255, 170, 0.3),
        0 0 4vh rgba(0, 255, 170, 0.15);
}

    .scanlines::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0,255,100,0.08),
            rgba(0,255,100,0.08) 10px,
            transparent 10px,
            transparent 20px
        );
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="crt">
    <div id="screen" class="scanlines"></div>
</div>

<script>
let started = false;
let countdownInterval = null;

const screen = document.getElementById("screen");

function startCountdown() {
    let count = 5;
    const minDigits = 0;

    function format(n) {
        return String(n).padStart(minDigits, "0");
    }

    screen.textContent = format(count);
    screen.classList.add("glitch");

    screen.getBoundingClientRect();

    countdownInterval = setInterval(() => {
        count--;

        if (count > 0) {
            screen.textContent = format(count);
        } else {
            clearInterval(countdownInterval);
            powerOff();
        }
    }, 1000);
}

function powerOff() {
    screen.classList.remove("glitch");
    screen.textContent = "";
    started = false;
}

// central input handler (fast path)
function trigger() {
    if (started) return;
    started = true;
    startCountdown();
    startGlitches(); // ADD THIS
}

// KEYBOARD — capture phase, highest priority
window.addEventListener("keydown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    trigger();
}, { capture: true });

// extra safety: some devices fire keypress inconsistently
window.addEventListener("keypress", (e) => {
    e.preventDefault();
    e.stopPropagation();
}, { capture: true });

// TOUCH / CLICK fallback
window.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    trigger();
}, { capture: true });

window.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    trigger();
}, { capture: true });

// prevent scroll/gesture side effects
window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });


let glitchTimer = null;

let baseTransform = "rotateX(5.5deg) scale(1.02)";

function applyTransform(extra = "") {
    screen.style.transform = `${baseTransform} ${extra}`;
}

function startGlitches() {
    if (glitchTimer) {
        clearTimeout(glitchTimer);
        glitchTimer = null;
    }

    function glitchOnce() {
        if (!started) return;

        const x = (Math.random() - 0.5) * 14;
        const y = (Math.random() - 0.5) * 10;

        applyTransform(`translate(${x}px, ${y}px)`);

        setTimeout(() => {
            applyTransform(""); // returns to base CRT warp
        }, 60);
    }

    function scheduleNext() {
        if (!started) return;

        const delay = 3 * 400 + Math.random() * 2800;

        glitchTimer = setTimeout(() => {
            glitchOnce();
            scheduleNext();
        }, delay);
    }

    scheduleNext();
}

</script>

</body>
</html>
