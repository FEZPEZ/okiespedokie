<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal Countdown</title>

<!-- PWA / fullscreen -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="manifest" href="manifest.json">

<!-- Silkscreen font -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: black;
        overflow: hidden;
        height: 100%;
    }

    #screen {
    width: 100vw;
    height: 100vh;

    display: grid;
    place-items: center;

    font-family: "Silkscreen", monospace;
    font-weight: 400;
    font-size: min(85vw, 85dvh);

    line-height: 1;

    color: #00ff66;
    user-select: none;
    transition: transform 60ms linear;
}

    .scanlines::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0,255,100,0.08),
            rgba(0,255,100,0.08) 2px,
            transparent 2px,
            transparent 4px
        );
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="screen" class="scanlines"></div>

<script>
let started = false;
let countdownInterval = null;

const screen = document.getElementById("screen");

function startCountdown() {
    let count = 5;

    screen.textContent = count;
    screen.classList.add("glitch");

    // force immediate paint so first frame doesn't lag
    screen.getBoundingClientRect();

    countdownInterval = setInterval(() => {
        count--;

        if (count > 0) {
            screen.textContent = count;
        } else {
            clearInterval(countdownInterval);
            powerOff();
        }
    }, 1000);
}

function powerOff() {
    screen.classList.remove("glitch");
    screen.textContent = "";
    started = false;
}

// central input handler (fast path)
function trigger() {
    if (started) return;
    started = true;
    startCountdown();
    startGlitches(); // ADD THIS
}

// KEYBOARD — capture phase, highest priority
window.addEventListener("keydown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    trigger();
}, { capture: true });

// extra safety: some devices fire keypress inconsistently
window.addEventListener("keypress", (e) => {
    e.preventDefault();
    e.stopPropagation();
}, { capture: true });

// TOUCH / CLICK fallback
window.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    trigger();
}, { capture: true });

window.addEventListener("mousedown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    trigger();
}, { capture: true });

// prevent scroll/gesture side effects
window.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });


let glitchTimer = null;

function startGlitches() {
    function glitchOnce() {
        if (!started) return;

        const x = (Math.random() - 0.5) * 14; // small random shift
        const y = (Math.random() - 0.5) * 10;

        screen.style.transform = `translate(${x}px, ${y}px)`;

        // snap back very quickly
        setTimeout(() => {
            screen.style.transform = "translate(0px, 0px)";
        }, 60);
    }

    function scheduleNext() {
        if (!started) return;

        // random delay: mostly quiet, occasional glitch
        const delay = 400 + Math.random() * 1800;

        glitchTimer = setTimeout(() => {
            glitchOnce();
            scheduleNext();
        }, delay);
    }

    scheduleNext();
}

</script>

</body>
</html>
