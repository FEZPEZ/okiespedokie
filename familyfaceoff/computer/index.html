<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>

<!-- Mobile viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<!-- PWA / standalone app behavior -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Status bar appearance (iOS) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- App title when saved -->
<meta name="apple-mobile-web-app-title" content="Terminal Countdown">
<meta name="application-name" content="Terminal Countdown">

<!-- Theme / browser chrome color -->
<meta name="theme-color" content="#000000">

<!-- Disable phone number auto-linking -->
<meta name="format-detection" content="telephone=no">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
}

/* CRT container */
#crt {
    width: 100vw;
    height: 100vh;
    perspective: 900px;
    background: black;
    position: relative;
    color: #7CFF5B;
    overflow: hidden;
}

/* shared transform space */
#layer {
    width: 100%;
    height: 100%;
    transform: rotateX(5.5deg) scale(1.02);
    transform-origin: center;
    position: relative;
    transition: transform 1ms linear;
}

/* ASCII screen */
#screen {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    white-space: pre;
    font-family: monospace;
    color: inherit;
    user-select: none;

    font-size: 45px;
    line-height: 1;

    margin: 0;
    padding: 0;

    text-shadow:
        0 0 0.5vh currentColor,
        0 0 1.2vh currentColor,
        0 0 2.5vh currentColor,
        0 0 4vh rgba(124, 255, 91, 0.12);
}

/* FINAL ASCII MODE */
#final {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8vw;
    pointer-events: none;
}

#final.active {
    display: flex;
}

#final pre {
    margin: 0;
    white-space: pre;
    font-family: monospace;
    color: inherit;

    text-shadow:
        0 0 0.3vh currentColor,
        0 0 0.9vh currentColor;
}

/* scanlines */
.scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,100,0.08),
        rgba(0,255,100,0.08) 10px,
        transparent 10px,
        transparent 20px
    );
    pointer-events: none;
}

/* transition line layer */
#transition-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Keyboard side flash overlays */
.side-glow {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 25%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease-out;
    z-index: 998;
}

#glow-left {
    left: 0;
    background: linear-gradient(to right, rgba(0, 255, 170, 0.4), transparent);
}

#glow-right {
    right: 0;
    background: linear-gradient(to left, rgba(0, 255, 170, 0.4), transparent);
}
</style>
</head>

<body>

<div id="crt" class="scanlines">
    <!-- Side flash effect overlays -->
    <div id="glow-left" class="side-glow"></div>
    <div id="glow-right" class="side-glow"></div>

    <div id="layer">

        <pre id="screen"></pre>

        <div id="final">
            <pre id="fork"></pre>
            <pre id="spoon"></pre>
        </div>

    </div>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
